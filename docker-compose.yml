services:

  # Phoenix — open-source LLM observability UI and OTLP trace collector
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # Phoenix UI + OTLP/HTTP receiver
    restart: unless-stopped

  # Travel assistant FastAPI server
  travel-assistant:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override Phoenix host to use Docker Compose service name instead of localhost
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006
    depends_on:
      - phoenix
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
