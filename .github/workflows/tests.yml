name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Tests never call the OpenAI API, but ChatOpenAI requires a key at construction time.
      OPENAI_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Type check (Pyright, same checks as VS Code Pylance)
        run: uv run pyright

      - name: Run tests
        run: uv run pytest tests/ -v
