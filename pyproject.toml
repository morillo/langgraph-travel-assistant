[project]
name = "langgraph-travel-assistant"
version = "1.0.0"
description = "Travel assistant LangGraph agent with OpenTelemetry tracing and LLM-as-a-judge evaluations"
authors = [{ name = "Carlos Morillo", email = "carlos.morillo@gmail.com" }]
requires-python = ">=3.11,<3.13"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langgraph>=0.2,<0.3",
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "ddgs>=9.0,<10",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.32,<0.33",
    "requests>=2.32,<3",
    # Observability — pure OpenTelemetry SDK + OpenInference instrumentation.
    # Phoenix runs as a separate Docker container; the app ships traces to it via OTLP/HTTP.
    "openinference-instrumentation-langchain>=0.1.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    # Evaluation pipeline dependencies
    "openai>=1.0,<2",
    "pandas>=2.0,<3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<0.24",
]
evals = [
    # The Phoenix client (arize-phoenix on PyPI) is pinned to 7.0.0 — the highest
    # version compatible with openai ^1.0. Versions >=16.x require pydantic-ai-slim,
    # which pulls in openai>=2.29.0 and conflicts with langchain-openai's openai ^1.0
    # requirement. The 7.0.0 client works against the latest Phoenix server for all
    # features we use: run_experiment(), upload_dataset(), get_spans_dataframe().
    "arize-phoenix==7.0.0",
    "httpx<0.28",
    "nest-asyncio>=1.5",
]

[tool.uv]
package = false
default-groups = "all"
